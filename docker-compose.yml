
services:
  postgres:
    image: postgres:16-alpine
    container_name: productcatalog-db
    environment:
      POSTGRES_DB: productcatalog
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: product123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productcatalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: productcatalog-api
    volumes:
      - product_images:/app/uploads/products
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productcatalog
      SPRING_DATASOURCE_USERNAME: productuser
      SPRING_DATASOURCE_PASSWORD: product123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  product_images:

