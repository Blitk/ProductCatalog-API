
spring.application.name=product-catalog

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productcatalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:productuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:product123}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Upload de imagens
app.upload.dir=${APP_UPLOAD_DIR:uploads/products}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
